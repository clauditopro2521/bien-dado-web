<!-- Copia de la portada "Tu contenido, bien dado." quitada de index.html el 22 de octubre de 2026.
     Para reponerla: el CSS va dentro del <style> de index.html (necesita las variables --intro-top, --intro-bottom y --wave)
     y el HTML dentro de la carpeta de Inicio, después de la sección #para-creadores. -->
<style>
:root { --intro-top: var(--azul); --intro-bottom: #22357a; --wave: var(--rosa); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: var(--step-4); letter-spacing: -0.01em; }
/* Titular centrado: "bien dado" en caja rosa fuerte que entra de izquierda a derecha */
.hero-title { grid-column: 1 / -1; display: grid; justify-items: center; gap: 14px; text-align: center; }
.hero h1 em {
  --caja: var(--rosa-fuerte);
  position: relative; display: inline-block; isolation: isolate; overflow: hidden;
  font-style: normal; color: var(--crema); white-space: nowrap;
  padding: 0.04em 0.28em 0.1em; border-radius: 12px;
  animation: bd-text 1.1s ease-out 2.2s both;
}
.hero h1 em::before {
  content: ""; position: absolute; inset: 0; z-index: -2; border-radius: inherit;
  background: var(--caja); transform-origin: left center;
  animation: bd-wipe 1.1s cubic-bezier(.7,0,.2,1) 1.6s both;
}
.hero h1 em::after {
  content: ""; position: absolute; inset: 0; z-index: -1; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
  transform: translateX(-120%);
  animation: bd-sheen 5s ease-in-out 3.6s infinite;
}
/* Pantalla de entrada: el titular ocupa toda la pantalla */
.intro .wrap {
  display: grid; grid-template-columns: 1fr; place-items: center; position: relative;
  min-height: calc(100vh - 66px); min-height: calc(100svh - 66px); padding-block: 48px 96px;
}
.intro { position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(180deg, var(--intro-top) 0%, var(--intro-bottom) 100%); }
.intro .wrap { z-index: 1; }
.intro h1 { color: var(--crema); }
.intro .label { color: var(--rosa); }
.intro h1 { font-size: clamp(3.2rem, 10.5vw, 8rem); animation: bd-zoom 2s cubic-bezier(.16,.8,.24,1) .1s both; }
.intro .label { animation: bd-fade 1.2s ease 1.6s both; }
/* El titular llega desde adelante (grande y desenfocado) hasta su lugar */
@keyframes bd-zoom {
  from { opacity: 0; transform: scale(1.7); filter: blur(14px); }
  60% { opacity: 1; filter: blur(0); }
  to { opacity: 1; transform: scale(1); filter: blur(0); }
}
@keyframes bd-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Olas de fondo: rosa fuerte, rosa claro y crema, que funde con la sección siguiente */
.waves { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; z-index: 0; pointer-events: none; }
.wave { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: wave-move linear infinite; }
.wave path { fill: var(--wave); }
.wave.w1 { animation-duration: 42s; height: 100%; }
.wave.w1 path { fill: var(--rosa-fuerte); }
.wave.w2 { animation-duration: 32s; animation-direction: reverse; height: 82%; }
.wave.w2 path { fill: var(--paper); }
.wave.w3 { animation-duration: 24s; height: 62%; }
.wave.w3 path { fill: var(--paper-2); } /* funde con "Cómo trabajamos", que va debajo */
@keyframes wave-move { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes bd-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes bd-text { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes bd-sheen { 0% { transform: translateX(-120%); } 45%, 100% { transform: translateX(320%); } }
</style>

  <section class="intro hero">
    <div class="wrap">
      <div class="hero-title">
        <span class="label">Micro agencia UGC · Lima, Perú</span>
        <h1>Tu contenido, <em>bien dado.</em></h1>
      </div>
    </div>
    <div class="waves" aria-hidden="true">
      <svg class="wave w1" viewBox="0 0 2400 200" preserveAspectRatio="none"><path d="M0,90 C200,140 400,40 600,90 C800,140 1000,40 1200,90 C1400,140 1600,40 1800,90 C2000,140 2200,40 2400,90 L2400,200 L0,200 Z"/></svg>
      <svg class="wave w2" viewBox="0 0 2400 200" preserveAspectRatio="none"><path d="M0,110 C300,60 500,160 800,110 C1000,75 1100,130 1200,110 C1500,60 1700,160 2000,110 C2200,75 2300,130 2400,110 L2400,200 L0,200 Z"/></svg>
      <svg class="wave w3" viewBox="0 0 2400 200" preserveAspectRatio="none"><path d="M0,130 C250,100 350,165 600,135 C850,105 950,160 1200,130 C1450,100 1550,165 1800,135 C2050,105 2150,160 2400,130 L2400,200 L0,200 Z"/></svg>
    </div>
  </section>
